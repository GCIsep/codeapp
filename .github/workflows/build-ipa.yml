
name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Check Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Download iOS Frameworks
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Code.xcodeproj \
            -scheme "Code App"

      - name: Build unsigned iOS archive
        run: |
          set -o pipefail

          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme "Code App" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/CodeApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            | tee "$RUNNER_TEMP/build.log"

      - name: Package unsigned IPA
        run: |
          set -e

          APP_PATH="$RUNNER_TEMP/CodeApp.xcarchive/Products/Applications"

          APP=$(find "$APP_PATH" -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No application found in archive."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"

          zip -r "$GITHUB_WORKSPACE/CodeApp-Unsigned.ipa" Payload

          echo "IPA successfully packaged."
          ls -lh "$GITHUB_WORKSPACE/CodeApp-Unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Build-Log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
