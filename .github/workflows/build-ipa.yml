name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Export App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Install Dependencies
        run: |
          if [ -f "downloadFrameworks.sh" ]; then
            chmod +x downloadFrameworks.sh
            ./downloadFrameworks.sh
          fi
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Detect Scheme and Resolve Dependencies
        run: |
          SCHEME=$(xcodebuild -list -project Code.xcodeproj | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | head -n 1 | xargs)
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Detected scheme: $SCHEME"

          xcodebuild -resolvePackageDependencies \
            -project Code.xcodeproj \
            -scheme "$SCHEME"

      - name: Build iOS Application
        run: |
          xcodebuild build \
            -project Code.xcodeproj \
            -scheme "${{ env.SCHEME }}" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package into IPA Format
        run: |
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r CodeApp-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: build/CodeApp-Unsigned.ipa
