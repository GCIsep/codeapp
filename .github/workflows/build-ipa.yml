name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Export App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Dependencies
        run: |
          if [ -f "downloadFrameworks.sh" ]; then
            chmod +x downloadFrameworks.sh
            ./downloadFrameworks.sh
          fi
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Detect Scheme and Build iOS Application
        run: |
          # Automatically detect the first scheme from Code.xcodeproj if not specified
          SCHEME=$(xcodebuild -list -project Code.xcodeproj | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | head -n 1 | xargs)
          echo "Detected scheme: $SCHEME"

          xcodebuild build \
            -project Code.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package into IPA Format
        run: |
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r CodeApp-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: build/CodeApp-Unsigned.ipa
