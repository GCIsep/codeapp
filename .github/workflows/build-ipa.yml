
name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Download iOS Frameworks
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Code.xcodeproj \
            -scheme "Code App"

      - name: Build iOS Archive
        run: |
          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme "Code App" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/CodeApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -e

          APP_PATH=$(find \
            "$RUNNER_TEMP/CodeApp.xcarchive/Products/Applications" \
            -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App not found in archive!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          zip -r "$GITHUB_WORKSPACE/CodeApp-Unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
