name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install Dependencies & Download Frameworks
        run: |
          if [ -f "downloadFrameworks.sh" ]; then
            chmod +x downloadFrameworks.sh
            ./downloadFrameworks.sh
          fi
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Detect Scheme & Resolve Packages
        run: |
          SCHEME=$(xcodebuild -list -project Code.xcodeproj | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | head -n 1 | xargs)
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Detected scheme: $SCHEME"

          xcodebuild -resolvePackageDependencies \
            -project Code.xcodeproj \
            -scheme "$SCHEME"

      - name: Build Unsigned Application
        run: |
          xcodebuild build \
            -project Code.xcodeproj \
            -scheme "${{ env.SCHEME }}" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-suppress-warnings" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package into IPA Format
        run: |
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r CodeApp-Unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: build/CodeApp-Unsigned.ipa
